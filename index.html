<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Craque dos Números</title>
<meta name="description" content="Jogo de carreira de futebol com matemática do 6º e 7º ano.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Figtree:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: estádio à noite — cartão do jogador à esquerda, decisão da temporada ao centro, sala de troféus e trajetória abaixo */
:root{
  color-scheme: dark;
  --bg:#0b120e; --panel:#121c16; --panel2:#18251d; --line:#253629;
  --fg:#eef3ee; --muted:#93a597; --grass:#3fd67f; --gold:#f5c542; --red:#ff6b5e; --sky:#8fd3ff;
  --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.5;
  background:radial-gradient(1200px 500px at 50% -200px,#16301f 0%,transparent 70%),var(--bg);min-height:100%}
.wrap{max-width:1140px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:24px}
.logo{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase;background:none;border:0;color:var(--fg);padding:0}
.logo b{color:var(--grass)}
.tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);font-weight:800;text-transform:uppercase;margin:0;text-wrap:balance;line-height:1.02}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{background:var(--grass);color:#06120a;border:0;border-radius:10px;padding:13px 22px;font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.small{font-size:15px;padding:8px 12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mut{color:var(--muted);font-weight:500}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Capa */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;padding-block:12px 28px}
.hero h1{font-size:clamp(48px,9vw,104px)}
.hero h1 span{color:var(--gold);display:block}
.hero p{color:var(--muted);max-width:54ch;font-size:18px;margin-top:12px}
.pitch{aspect-ratio:4/3;max-width:100%;border-radius:16px;border:1px solid var(--line);position:relative;overflow:hidden;
  background:repeating-linear-gradient(90deg,#163a22 0 40px,#18412a 40px 80px)}
.pitch::before{content:"";position:absolute;inset:14px;border:2px solid #ffffff55;border-radius:4px}
.pitch::after{content:"";position:absolute;left:50%;top:14px;bottom:14px;border-left:2px solid #ffffff55}
.pitch .circ{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;border:2px solid #ffffff55;border-radius:50%;transform:translate(-50%,-50%)}
.pitch .eq{position:absolute;font-family:var(--mono);font-weight:700;color:#fff;background:#0b120ecc;padding:6px 10px;border-radius:8px;font-size:15px}
.setup{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,textarea{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;width:100%}
textarea{font-family:var(--mono);font-size:12px;min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
.chip:has(input:checked){border-color:var(--grass);background:#1b3a26}
.chip input{accent-color:var(--grass)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{flex:1;min-width:100px;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 8px;cursor:pointer;font-weight:700;font-size:15px;line-height:1.25}
.seg label small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.seg label:has(input:checked){border-color:var(--gold);color:var(--gold)}
.seg label:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:2px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.continue{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-color:#6b5520;margin-bottom:20px}
.continue .info{flex:1;min-width:200px}
details summary{cursor:pointer;color:var(--muted);font-weight:700}
.hall li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hall{list-style:none;padding:0;margin:8px 0 0}

/* Jogo */
.game{display:grid;grid-template-columns:310px minmax(0,1fr);gap:24px;align-items:start}
.card{display:flex;flex-direction:column;gap:14px}
.cardsec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.pname{text-align:center}
.pname h2{font-size:32px}
.pname .sub{color:var(--muted);font-size:14px}
.ovr{display:flex;align-items:center;gap:12px}
.ovr .big{font-family:var(--display);font-weight:800;font-size:48px;color:var(--gold);line-height:1}
.bar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--grass),var(--gold));transition:width .6s}
.bar i.gold{background:var(--gold)}
.bar i.sky{background:var(--sky)}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.totals div{background:var(--panel2);border-radius:10px;padding:10px 4px}
.totals strong{display:block;font-family:var(--mono);font-size:20px}
.totals span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.money{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.money strong{font-family:var(--mono)}
.club{display:flex;align-items:center;gap:10px}
.crest{flex:none;display:block;filter:drop-shadow(0 2px 3px #0006)}
.teamband{position:relative;border-radius:12px;padding:18px 12px 12px;display:flex;justify-content:center;border-bottom:5px solid var(--t2);background:var(--t1);background:linear-gradient(160deg,var(--t1) 0%,color-mix(in srgb,var(--t1) 30%,var(--panel)) 80%)}
.teamband .crest{position:absolute;left:10px;top:10px}
.attrs{display:flex;flex-direction:column;gap:8px}
.at,.chrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px;color:var(--muted)}
.at b,.chrow b{font-family:var(--mono);color:var(--fg)}
.at .bar,.chrow .bar{grid-column:1/-1;height:6px}
.at.key span{color:var(--fg);font-weight:700}
.accbig{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.shelf{display:flex;flex-wrap:wrap;gap:6px}
.tr-mini{display:flex;align-items:center;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 7px 3px 3px;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--gold)}
.season-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.season-head h2{font-size:clamp(34px,5vw,52px)}
.pill{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--panel2);border:1px solid var(--line)}
.pill.topic{color:var(--grass);border-color:#2f6a43}
.notice{background:#2a2410;border:1px solid #6b5520;color:var(--gold);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:700}
.story{font-size:18px;max-width:64ch}
.data{width:100%;border-collapse:collapse;font-size:15px;margin-top:14px}
.data th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
.data td{padding:9px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.data td.new{color:var(--gold);font-family:var(--mono);font-weight:700}
.step{margin-top:20px;padding-top:18px;border-top:1px dashed var(--line)}
.step>.label{color:var(--gold)}
.question{font-size:20px;font-weight:700;max-width:62ch;margin-top:6px}
.eqbox{font-family:var(--mono);background:var(--panel2);border-radius:8px;padding:10px 14px;display:inline-block;margin-top:10px;max-width:100%;overflow-x:auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opt{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:15px;text-align:left;font-family:var(--mono);font-size:18px;font-weight:700;display:flex;gap:12px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--grass)}
.opt .k{font-family:var(--display);color:var(--muted);font-size:18px}
.opt.right{border-color:var(--grass);background:#173822}
.opt.wrong{border-color:var(--red);background:#3a1a17}
.opt:disabled{cursor:default}
.feedback{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--panel2)}
.feedback.ok{border-color:#2f6a43}
.feedback.no{border-color:#6b2f2a}
.feedback h3{font-size:22px}
.feedback.ok h3{color:var(--grass)}
.feedback.no h3{color:var(--red)}
.feedback p{margin-top:4px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.choice{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px}
.choice .hd{display:flex;gap:10px;align-items:center}
.choice strong{font-family:var(--display);font-size:22px;text-transform:uppercase;line-height:1.05}
.choice span{color:var(--muted);font-size:14px}
.choice:hover:not(:disabled){border-color:var(--gold)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.outcome{font-size:18px;max-width:64ch;margin-top:4px}
.celebrate{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(90deg,#3a2f10,var(--panel));border:1px solid #6b5520;border-radius:14px;padding:16px;margin-bottom:18px}
.celebrate h3{color:var(--gold);font-size:34px}
.celebrate .icons{display:flex;gap:6px;flex-wrap:wrap}
.celebrate .icons svg{animation:trophyPop .7s ease-out both}
@keyframes trophyPop{0%{transform:scale(.5) rotate(-12deg)}70%{transform:scale(1.15)}100%{transform:none}}
.seasons{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.srow{display:grid;grid-template-columns:110px repeat(3,minmax(0,1fr));gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
.srow .yr{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.srow .yr small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;margin-top:4px}
.srow .v{font-family:var(--mono);font-size:20px;font-weight:700}
.comps{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.comp{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;align-items:baseline}
.comp .nm{display:flex;gap:6px;align-items:center;font-weight:700}
.comp .res{font-weight:700}
.comp.win .res,.comp.win .nm{color:var(--gold)}
.ch{color:var(--muted);font-family:var(--mono);font-size:12px;font-weight:500}
.natblock{grid-column:1/-1;background:#10202b;border:1px solid #24506b;border-radius:10px;padding:12px 14px}
.natblock h3{font-size:22px;color:var(--sky)}
.matches{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.match{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:8px;font-size:14px}
.match .st{color:var(--muted)}
.match .r{font-family:var(--mono);font-weight:700}
.match .r.V{color:var(--grass)} .match .r.D{color:var(--red)} .match .r.E{color:var(--muted)}
.trophies{display:flex;flex-wrap:wrap;gap:8px;grid-column:1/-1}
.trophy{background:#3a2f10;color:var(--gold);border:1px solid #6b5520;border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px}
.deltas{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.delta{border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;border:1px solid var(--line);font-family:var(--mono)}
.delta.up{color:var(--grass);border-color:#2f6a43;background:#132a1b}
.delta.down{color:var(--red);border-color:#6b2f2a;background:#2a1513}
.inj{grid-column:1/-1;color:var(--red);font-size:14px;font-weight:700}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.timeline{margin-top:24px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:10px}
.tg{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;min-width:0}
.tg .cnt{font-family:var(--display);font-weight:800;font-size:30px;color:var(--gold);line-height:1}
.tg .nm{font-weight:700;font-size:14px;line-height:1.2}
.tg .yrs{font-size:11px;color:var(--muted);font-family:var(--mono);overflow-wrap:anywhere}
.tl{width:100%;border-collapse:collapse;font-size:14px}
.tl th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tl td.n{font-family:var(--mono);text-align:right}
.cl{display:flex;gap:8px;align-items:center}
.tl .cl{white-space:nowrap}
.mark{font-weight:700;white-space:nowrap}
.mark.ok{color:var(--grass)} .mark.no{color:var(--red)}
.scroll{overflow-x:auto}
.codebox{display:flex;flex-direction:column;gap:8px}
.toast{color:var(--grass);font-size:14px}

/* Final */
.final{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.legend h1{font-size:clamp(44px,7vw,78px)}
.legend .lvl{color:var(--gold)}
.bigstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.bigstats div{background:var(--panel2);border-radius:12px;padding:14px;text-align:center}
.bigstats strong{display:block;font-family:var(--display);font-size:38px;line-height:1}
.bigstats span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.acchero{font-family:var(--display);font-weight:800;font-size:clamp(84px,14vw,140px);line-height:.9}
.topics{list-style:none;padding:0;margin:8px 0 0}
.topics li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
pre.sum{white-space:pre-wrap;background:var(--panel2);padding:12px;border-radius:10px;font-family:var(--mono);font-size:13px;margin:12px 0 0}

.scoreboard{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px}
.scoreboard .team{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:700;font-size:14px;min-width:0}
.scoreboard .score{font-family:var(--display);font-size:60px;font-weight:800;line-height:1}
.lances{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.lance{font-size:14px;padding:8px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.lance.ok{border-color:#2f6a43}.lance.no{border-color:#6b2f2a}
.matchsum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:15px}
.matchsum span{flex:1;min-width:0}
@media (max-width:860px){
  .hero,.setup,.game,.final{grid-template-columns:minmax(0,1fr)}
  .opts{grid-template-columns:1fr}
  .srow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .srow .yr{grid-column:1/-1}
  .match{grid-template-columns:80px minmax(0,1fr) auto}
  .bigstats strong{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:translateY(8px)}to{transform:none}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>

<div class="wrap">
  <header class="top">
    <button class="logo" id="home" title="Voltar ao menu (a carreira fica salva)">Craque dos <b>Números</b></button>
    <div class="tag">Matemática · 6º e 7º ano</div>
  </header>
  <main id="app"></main>
</div>

<script>
// ================= utilitários =================
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const wpick=(arr,wf)=>{let t=arr.reduce((s,x)=>s+wf(x),0)*Math.random();for(const x of arr){t-=wf(x);if(t<=0)return x}return arr[arr.length-1]};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const round2=n=>Math.round(n*100)/100;
const fmt=n=>Number(n).toLocaleString('pt-BR',{maximumFractionDigits:2});
const brl=n=>'R$ '+Math.round(n).toLocaleString('pt-BR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function options(correct,distract,f=fmt){
  const set=[correct];
  for(const d of distract){const v=round2(d);if(isFinite(v)&&v>=0&&!set.some(x=>Math.abs(x-v)<1e-9))set.push(v);if(set.length===4)break}
  let k=1;while(set.length<4){const step=Number.isInteger(correct)?Math.max(1,Math.round(Math.abs(correct)*0.1)):0.1;const v=round2(correct+(k%2?1:-1)*Math.ceil(k/2)*step);if(v>=0&&!set.some(x=>Math.abs(x-v)<1e-9))set.push(v);k++}
  return shuffle(set).map(v=>({v,t:f(v)}));
}
function Q(topic,q,eq,correct,distract,exp,f=fmt){return {topic,q,eq,opts:options(correct,distract,f),correct,exp}}

// ================= ligas e clubes (clubes fictícios, ligas reais) =================
// clube: [nome, sigla, cor 1, cor 2, força 1-9, formato do escudo, padrão do uniforme, símbolo, nível 1-3]
const CONF_CUPS={SA:['Libertadores','Sul-Americana'],EU:['Liga dos Campeões','Liga Europa'],NA:['Concacaf Champions Cup',null],AS:['Liga dos Campeões da Ásia',null]};

function pickClub(tier,excl=[],maxNeed=99){
  const own=COUNTRIES[S.pais];
  const base=ALL.filter(c=>c.tier===tier&&!excl.includes(c.n)&&!['SA1','US1','NO1'].includes(c.lk));
  let pool=base.filter(c=>clubNeed(c)<=maxNeed);
  if(!pool.length&&base.length){const mn=Math.min(...base.map(clubNeed));pool=base.filter(c=>clubNeed(c)===mn)}
  if(tier===1){const o=pool.filter(c=>c.lk===own.div2);if(o.length)pool=o}
  if(tier===2&&Math.random()<.5){const o=pool.filter(c=>c.lk===own.top);if(o.length)pool=o}
  return {...pick(pool.length?pool:ALL.filter(c=>c.tier===tier))};
}
const estPlay=(ovr,t)=>clamp(0.3+(ovr-(typeof t==='object'?clubNeed(t):NEED[t]))/18,0.12,1);
function nearestFr(x){let b=FR[0];for(const f of FR)if(Math.abs(f[0]/f[1]-x)<Math.abs(b[0]/b[1]-x))b=f;return b}
const frs=f=>f[0]+'/'+f[1];

// ================= competições e chances de título =================
const K_T=0.9;
function powerOf(c,ovr,play){return c.q+clamp((ovr-clubNeed(c))/8,-1,0.8)*(play>.4?1:.5)}
function shareP(P,rivals,filler,fq){const e=Math.exp(K_T*P);return e/(e+rivals.reduce((t,q)=>t+Math.exp(K_T*q),0)+filler*Math.exp(K_T*fq))}
function compsFor(c){const lg=lgOf(c),cc=CONF_CUPS[lg.conf];const out=[{k:'liga',n:lg.n},{k:'cup',n:lg.cup}];
  if(c.tier>=2){if(c.q>=7&&cc[0])out.push({k:'cont',n:cc[0]});else if(c.q>=5&&cc[1])out.push({k:'sec',n:cc[1]})}
  if(S.mundial&&c.tier>=2)out.push({k:'mund',n:'Mundial de Clubes'});
  return out}
function chanceOf(k,c,P){const lg=lgOf(c);
  const liga=()=>{const o=ALL.filter(x=>x.lk===c.lk&&x.n!==c.n).map(x=>x.q);return shareP(P,o,Math.max(0,19-o.length),c.tier===1?4:5.2)};
  if(k==='liga')return liga();
  if(k==='cup')return liga()*0.45+0.01;
  if(k==='cont')return shareP(P,ALL.filter(x=>lgOf(x).conf===lg.conf&&x.n!==c.n&&x.q>=7).map(x=>x.q),20,6);
  if(k==='sec')return shareP(P,ALL.filter(x=>lgOf(x).conf===lg.conf&&x.n!==c.n&&x.q>=5&&x.q<=7).map(x=>x.q),30,5);
  if(k==='mund')return lg.conf==='EU'?.45:.25;
  return 0}
function chanceList(){const c=S.club,P=powerOf(c,S.ovr,estPlay(S.ovr,c));return compsFor(c).map(x=>({n:x.n,p:Math.max(1,Math.round(chanceOf(x.k,c,P)*100))}))}
const STAGES={cup:['na 1ª fase','nas oitavas','nas quartas','na semifinal','na final'],cont:['na fase de grupos','nas oitavas','nas quartas','na semifinal','na final'],mund:['na semifinal','na final']};
STAGES.sec=STAGES.cont;
function runCup(k,p){const st=STAGES[k],n=st.length,r=Math.pow(Math.max(p,0.001),1/n);let i=0;while(i<n&&Math.random()<r)i++;
  if(i===n)return{win:true,res:'Campeão'};if(i===n-1)return{win:false,res:'Vice-campeão'};return{win:false,res:'Eliminado '+st[i]}}
function runLeague(c,p,P){if(Math.random()<p)return{win:true,res:'Campeão'};
  const others=ALL.filter(x=>x.lk===c.lk&&x.n!==c.n),st=others.map(x=>x.q);while(st.length<19)st.push((c.tier===1?4:5.2)+R(-15,15)/10);
  const me=P+R(-12,12)/10,pos=clamp(1+st.filter(v=>v+R(-12,12)/10>me).length,2,20);
  return{win:false,res:pos+'º lugar',champ:others.length?wpick(others,x=>Math.exp(K_T*x.q)).n:null}}

function callChance(){const st=NAT[myNat()];if(S.ovr<st-14)return 0;let p=clamp(0.5+(S.ovr-(st-6))/12,0,0.97);if(['SA1','US1'].includes(S.club.lk))p-=.1;return clamp(p,0,.97)}
function runTournament(tour,callP,hurt){
  const me=myNat(),base=NAT[me];
  const out={name:tour.name,year:S.year,wc:tour.wc,callP:Math.round(clamp(callP,0,.97)*100),called:false,matches:[],goals:0,finish:'',win:false};
  if(hurt){out.finish='Fora por lesão';return out}
  if(Math.random()>=clamp(callP,0,.97)){out.finish='Não convocado';return out}
  out.called=true;out.starter=S.ovr>=base-4;
  const T=base+(out.starter?(S.ovr-base)*0.25:0)+R(-2,2);
  const pool=shuffle((tour.wc?Object.keys(NAT):CONFED[COUNTRIES[S.pais].conf]).filter(n=>n!==me));
  const gp=(out.starter?{ATA:.42,MEI:.22,ZAG:.07,GOL:0}:{ATA:.15,MEI:.08,ZAG:.02,GOL:0})[S.pos];
  const used=new Set();
  const play=(stage,opp,ko)=>{used.add(opp);const pA=1/(1+Math.pow(10,(NAT[opp]-T)/14));let res,gf,ga,pens=false;
    if(!ko&&Math.random()<.24){res='E';gf=ga=R(0,2)}
    else{const w=Math.random()<pA;res=w?'V':'D';const hi=R(1,3),lo=R(0,hi-1);gf=w?hi:lo;ga=w?lo:hi;if(ko&&Math.abs(pA-.5)<.2&&Math.random()<.3){pens=true;gf=ga=R(0,2)}}
    const my=Math.min(gf,(Math.random()<gp?1:0)+(Math.random()<gp*.3?1:0));out.goals+=my;
    out.matches.push({stage,opp,gf,ga,res,pens,my});return res};
  let pts=0;for(let i=0;i<3;i++){const r=play('Grupos',pool[i],false);pts+=r==='V'?3:r==='E'?1:0}
  const adv=pts>=4||(pts===3&&Math.random()<.4);
  if(!adv){out.finish='Eliminado na fase de grupos';return out}
  const ko=tour.wc?['Oitavas','Quartas','Semifinal','Final']:['Quartas','Semifinal','Final'];
  const th=tour.wc?[74,78,81,84]:[72,76,80];
  for(let i=0;i<ko.length;i++){
    let cand=pool.filter(n=>!used.has(n)&&NAT[n]>=th[i]);if(!cand.length)cand=pool.filter(n=>!used.has(n));
    const r=play(ko[i],pick(cand),true);
    if(r==='D'){out.finish=ko[i]==='Final'?'Vice-campeão':{Oitavas:'Eliminado nas oitavas',Quartas:'Eliminado nas quartas',Semifinal:'Eliminado na semifinal'}[ko[i]];return out}
  }
  out.finish='Campeão';out.win=true;
  if(tour.wc&&out.starter&&(out.goals>=4||S.ovr>=86&&Math.random()<.5))out.mvp=true;
  return out;
}

function simSeason(first){

    else if(r<.85)inj={t:pick(['Lesão muscular na coxa','Estiramento na panturrilha','Lesão no ombro']),out:R(6,10),loss:{[sp]:-2}};
    else inj={t:pick(['Ruptura de ligamento no joelho','Fratura no pé']),out:R(16,24),loss:{[sp]:-3,fis:-3}};

  const ar={ATA:0.1,MEI:clamp((S.ovr-50)/140,0.04,0.3),ZAG:0.03,GOL:0}[pos];
  const goals=Math.round(games*gr*rnd())+(first?(m.matchGoals||0):0),assists=Math.round(games*ar*rnd());
  const cs=pos==='GOL'?Math.round(games*clamp(0.2+(S.ovr-60)/90,.1,.55)*rnd()):0;

  const titles=comps.filter(x=>x.win).map(x=>x.n);
  const aw=[];
  if(pos==='ATA'&&goals>=(c.tier===3?22:18)&&Math.random()<.6)aw.push('Artilheiro');
  if(pos==='GOL'&&cs>=16&&Math.random()<.6)aw.push('Luva de Ouro');
  if(S.ovr>=need+12&&play>.6&&Math.random()<.45)aw.push('Craque da '+lg.n);
  if(c.tier===3&&S.ovr>=84&&play>.6&&Math.random()<0.15+(S.ovr-84)*0.06+(S.mundial?.2:0))aw.push('Bola de Ouro');

    if(nat.called){S.caps+=nat.matches.length;S.intlGoals+=nat.goals;if(nat.wc)S.wcs++;if(nat.win)titles.push(tour.name);if(nat.mvp)aw.push('Melhor da Copa')}}
  if(cp>=.35){const k=R(3,8);S.caps+=k;S.intlGoals+=Math.round(k*gr*rnd()*.6)}
  titles.forEach(t=>S.titles.push({t,y:S.year}));aw.forEach(t=>S.awards.push({t,y:S.year}));
  // dinheiro e fama
  let earn=S.salary*12;
  if(m.contract){const st=m.contract.isGoal?goals:games;earn=m.contract.prod?m.contract.F+m.contract.b*st:m.contract.G}
  S.money+=earn;
  S.pop=clamp(Math.round(S.pop+goals*0.3+titles.length*4+aw.length*6+(nat&&nat.called?3:0)),0,100);
  // evolução

}

  return`<div class="comps">${h.comps.map(x=>`<div class="comp ${x.win?'win':''}"><span class="nm">${x.win?trophyIcon(x.n,16):''}${esc(x.n)}</span><span><span class="res">${esc(x.res)}</span>${x.champ?` <span class="ch">· campeão: ${esc(x.champ)}</span>`:''} <span class="ch">· chance de título: ${x.p}%</span></span></div>`).join('')}</div>`}
function natBlock(n){if(!n||(!n.called&&n.callP===0&&n.finish!=='Fora por lesão'))return'';
  const head=`<div class="row" style="justify-content:space-between"><h3>${esc(n.name)} ${n.year}</h3><span class="ch">chance de convocação: ${n.callP}%</span></div>`;
  if(!n.called)return`<div class="natblock">${head}<p style="margin-top:6px">${n.finish==='Fora por lesão'?'Você estava lesionado e ficou fora da competição.':'Você não foi convocado desta vez.'}</p></div>`;
  return`<div class="natblock">${n.win?`<div style="float:right">${trophyIcon(n.name,40)}</div>`:''}${head}<p style="margin-top:6px;font-weight:700">Convocado ${n.starter?'como titular':'como reserva'}! Resultado: <span style="color:${n.win?'var(--gold)':'var(--fg)'}">${esc(n.finish)}</span>${n.goals?` · você marcou ${n.goals} gol${n.goals>1?'s':''}`:''}${n.mvp?' · eleito o melhor da Copa':''}</p>
   <div class="matches">${n.matches.map(mt=>`<div class="match"><span class="st">${esc(mt.stage)}</span><span>${esc(myNat())} ${mt.gf} × ${mt.ga} ${esc(mt.opp)}${mt.pens?` <span class="ch">(${mt.res==='V'?'venceu':'perdeu'} nos pênaltis)</span>`:''}${mt.my?` <span class="ch">· ${mt.my} gol${mt.my>1?'s':''} seu${mt.my>1?'s':''}</span>`:''}</span><span class="r ${mt.res}">${mt.res==='V'?'Vitória':mt.res==='D'?'Derrota':'Empate'}</span></div>`).join('')}</div></div>`}

const app=document.getElementById('app');
function table(t){if(!t)return'';return`<div class="scroll"><table class="data"><thead><tr>${t.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>typeof c!=='object'?`<td>${esc(c)}</td>`:c.club?`<td><div class="cl">${crest(c.club,24)}<span>${esc(c.text)}</span></div></td>`:`<td class="new">${c.new}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}

function intro(msg=''){
  const sv=load(),hl=hall();let savedT=null;try{savedT=JSON.parse(localStorage.getItem('craque-topics')||'null')}catch(e){}
  app.innerHTML=`
  ${sv&&sv.phase!=='final'?`<div class="panel continue pop">
    ${shirt(sv.club,sv.num,70)}
    <div class="info"><div class="label">Carreira salva neste computador</div><h2 style="font-size:30px">${esc(sv.nome)}</h2><div class="mut">${POS[sv.pos]} · ${sv.age} anos · ${esc(sv.club.n)} · ${sv.year}</div></div>
    <button class="btn" id="cont">Continuar carreira</button></div>`:''}
  <section class="hero">
    <div>
      <div class="tag">Modo carreira</div>
      <h1>Vire lenda <span>com a matemática</span></h1>
      <p>Crie seu jogador e decida a carreira dele nas principais ligas do mundo: propostas, empréstimos, lesões, treinos especiais, finais e Copas do Mundo. Cada decisão traz uma conta, e quem faz a conta certa decide melhor. A carreira fica salva e vai até a aposentadoria.</p>
    </div>
    <div class="pitch" aria-hidden="true"><div class="circ"></div>
      <div class="eq" style="left:10%;top:16%">2x + 5 = 21</div>
      <div class="eq" style="right:8%;top:40%">7 × 8</div>
      <div class="eq" style="left:16%;bottom:16%">+25%</div>
      <div class="eq" style="right:14%;bottom:12%">2⁵ = ?</div>
    </div>
  </section>
  <form id="f" class="panel">
    <div class="setup">
      <div class="stack">
        <h2 style="font-size:28px">Seu jogador</h2>
        <div class="field"><label class="label" for="nome">Nome</label><input id="nome" maxlength="22" placeholder="Ex.: Ana Souza"></div>
        <div class="two">
          <div class="field"><label class="label" for="num">Número</label><input id="num" type="number" min="1" max="99" value="10"></div>
          <div class="field"><label class="label" for="pe">Pé preferido</label><select id="pe"><option>Direito</option><option>Esquerdo</option><option>Ambidestro</option></select></div>
        </div>
        <div class="field"><label class="label" for="pais">País (define a seleção e a liga onde você começa)</label><select id="pais">${Object.entries(COUNTRIES).map(([k,c])=>`<option value="${k}">${c.n}</option>`).join('')}</select></div>
        <div class="field"><span class="label">Posição</span>
          <div class="seg">${Object.entries(POS).map(([k,v],i)=>`<label><input type="radio" name="pos" value="${k}" ${i==0?'checked':''}>${v}</label>`).join('')}</div></div>
        <div class="field"><span class="label">Ritmo da carreira</span>
          <div class="seg">${[1,2,3].map(k=>`<label><input type="radio" name="mode" value="${k}" ${k==2?'checked':''}>${MODES[k]}<small>decisão a cada ${k===1?'temporada':k+' temporadas'}</small></label>`).join('')}</div></div>
      </div>
      <div class="stack">
        <h2 style="font-size:28px">Conteúdos</h2>
        <p class="mut">Professor(a): marque os temas que a turma está estudando. As decisões usam só esses conteúdos.</p>
        <div class="row"><button type="button" class="btn small ghost" data-preset="6">Turma do 6º ano</button><button type="button" class="btn small ghost" data-preset="7">Turma do 7º ano</button><button type="button" class="btn small ghost" data-preset="all">Todos</button></div>
        <div class="label">6º ano</div>
        <div class="chips">${BASIC_T.map(k=>`<label class="chip"><input type="checkbox" name="tp" value="${k}" ${!savedT||savedT.includes(k)?'checked':''}>${TOPICS[k]}</label>`).join('')}</div>
        <div class="label">7º ano</div>
        <div class="chips">${Object.keys(TOPICS).filter(k=>!BASIC_T.includes(k)).map(k=>`<label class="chip"><input type="checkbox" name="tp" value="${k}" ${!savedT||savedT.includes(k)?'checked':''}>${TOPICS[k]}</label>`).join('')}</div>
        <div style="margin-top:auto" class="stack">
          ${sv&&sv.phase!=='final'?`<p style="color:var(--gold);font-size:14px">Começar uma nova carreira substitui a carreira salva de ${esc(sv.nome)}. Copie o código dela antes, se quiser guardar.</p>`:''}

  <div class="setup" style="margin-top:20px">

    <div class="panel"><div class="label">Hall da fama deste computador</div>
      ${hl.length?`<ul class="hall">${hl.map(x=>`<li><span><strong>${esc(x.nome)}</strong> · ${esc(x.lvl)}</span><span class="num">${x.titles} títulos · ${x.acc}% contas</span></li>`).join('')}</ul>`:'<p class="mut" style="margin-top:8px">As carreiras encerradas aparecem aqui.</p>'}

  const cont=document.getElementById('cont');if(cont)cont.onclick=()=>{migrate(sv);render()};

  document.getElementById('impb').onclick=()=>{const m=document.getElementById('impmsg');
    try{const o=decode(document.getElementById('imp').value);if(!o||!o.nome||!o.club)throw 0;migrate(o);save();render()}catch(e){m.style.color='var(--red)';m.textContent='Código inválido. Confira se copiou o código inteiro.'}};
  document.getElementById('f').addEventListener('submit',e=>{
    e.preventDefault();
    const tps=[...document.querySelectorAll('input[name=tp]:checked')].map(x=>x.value);
    if(!tps.length){document.getElementById('err').textContent='Escolha pelo menos um conteúdo.';return}
    try{localStorage.setItem('craque-topics',JSON.stringify(tps))}catch(e){}
    start({nome:document.getElementById('nome').value.trim()||'Craque',
      num:clamp(parseInt(document.getElementById('num').value)||10,1,99),pe:document.getElementById('pe').value,
      pais:document.getElementById('pais').value,pos:document.querySelector('input[name=pos]:checked').value,
      mode:+document.querySelector('input[name=mode]:checked').value,topics:tps});

}

function start(o){
  makeCareer(o);
  S.notice=`Bem-vindo ao ${S.club.n}, da ${lgTxt(S.club)}! Você assinou seu primeiro contrato profissional: ${brl(S.salary)} por mês.`;
  newEvent();
}
function newEvent(){
  S.mods={};S.attrStart={...S.attr};
  S.ev=ensureMath(chooseEvent());S.lastType=S.ev.type;S.evOk=null;
  S.phase=S.ev.math?'q':'choose';save();render();window.scrollTo({top:0});
}
function startStep(){
  S.notice='';
  if(S.loanHome){S.club=S.loanHome;S.loanHome=null;S.notice=`Fim do empréstimo: você voltou ao ${S.club.n}.`}
  if(S.age>=38)return retire(`Aos ${S.age} anos, chegou a hora de pendurar as chuteiras.`);
  newEvent();
}
function answer(v){
  if(S.phase!=='q')return;
  const ok=Math.abs(v-S.ev.math.correct)<1e-9;S.evOk=ok;S.picked=v;
  if(ok){const k=wpick(attrList().filter(([x])=>WEI[S.pos][x]>0),([x])=>WEI[S.pos][x])[0];addAttr(k,2);S.bonusAttr=k;S.mods.conf=0.05}
  S.phase='choose';save();render();
}
function choose(id){
  if(S.phase!=='choose')return;
  const ev=S.ev,r=APPLY[ev.type](id,ev),text=typeof r==='string'?r:r.text;
  S.decisions.push({y:S.year,title:ev.title,choice:ev.choices.find(c=>c.id===id).label,topic:ev.math?ev.math.topic:null,ok:ev.math?S.evOk:null});
  if(r&&r.retire)return retire(text);
  S.pendingText=text;startMatch();
}
const LANCES=['Contra-ataque rápido pela direita!','Falta perigosa na entrada da área!','Escanteio a favor do seu time!','A bola sobrou na área!','Pênalti para o seu time!','Lançamento longo nas costas da zaga!'];
function startMatch(){
  const c=S.club,others=ALL.filter(x=>x.lk===c.lk&&x.n!==c.n),rv=others.length?wpick(others,x=>x.q):pickClub(c.tier,[c.n]);
  S.match={rival:slim(rv),rq:rv.q,gf:0,ga:0,i:0,my:0,lances:shuffle(LANCES).slice(0,3).map(t=>({t,q:quickQ()}))};
  S.phase='match';save();render();window.scrollTo({top:0});
}
function matchAnswer(v){const M=S.match,L=M.lances[M.i];if(!L||L.picked!=null)return;
  L.picked=v;L.ok=Math.abs(v-L.q.correct)<1e-9;S.drills.push({topic:L.q.topic,ok:L.ok,y:S.year});
  const atk=S.pos==='ATA'||S.pos==='MEI';
  if(L.ok&&Math.random()<.75){M.gf++;const me=Math.random()<(atk?.6:.12);if(me)M.my++;L.res=me?'GOL! Você marcou!':'GOL do seu time! A jogada começou com você.'}
  else if(L.ok)L.res=pick(['Jogada perfeita, mas o goleiro fez uma defesaça!','Que lance! A bola explodiu na trave.']);
  else if(Math.random()<clamp(.45+(M.rq-S.club.q)*.08,.2,.75)){M.ga++;L.res='O adversário roubou a bola e marcou.'}
  else L.res='A jogada não saiu, mas o adversário também desperdiçou.';
  save();render()}
function matchNext(){const M=S.match;M.i++;
  if(M.i>=M.lances.length&&!M.done){M.done=true;M.late=0;for(let k=0;k<2;k++)if(Math.random()<clamp(.25+(M.rq-S.club.q)*.07,.1,.6)){M.ga++;M.late++}}
  save();render()}
function finishStep(){const M=S.match;S.mods.matchBoost=M.gf>M.ga?.45:M.gf===M.ga?0:-.35;S.mods.matchGoals=M.my||0;
  const seasons=[];for(let i=0;i<S.mode;i++)seasons.push(simSeason(i===0));
  S.result={text:S.pendingText,seasons,match:{own:slim(S.club),rival:M.rival,gf:M.gf,ga:M.ga}};S.match=null;S.phase='result';save();render();window.scrollTo({top:0})}
function retire(text){S.retireText=text;S.phase='final';
  if(!S.hallSaved){const f=finalStats();addHall({nome:S.nome,lvl:f.lvl,titles:S.titles.length,acc:f.acc,score:f.score});S.hallSaved=true}
  save();render();window.scrollTo({top:0})}

function render(){
  if(S.phase==='final')return finale();
  const cl=resolve(S.club),ev=S.ev,yrs=S.mode>1?`${S.year}–${S.year+S.mode-1}`:S.year;
  const lbl=S.pos==="GOL"?"S/ gol":"Gols";
  let body='';
  if(S.phase==='q'||S.phase==='choose'){
    const m=ev.math,answered=S.phase==='choose'&&m;
    body=`
      ${S.notice?`<div class="notice">${esc(S.notice)}</div>`:''}
      <div class="season-head"><div><div class="label">${S.mode>1?'Temporadas':'Temporada'} ${yrs} · ${S.age} anos</div><h2>${esc(ev.title)}</h2></div>${m?`<span class="pill topic">${TOPICS[m.topic]}</span>`:''}</div>
      <p class="story">${esc(ev.story)}</p>
      ${table(answered&&ev.table2?ev.table2:ev.table)}
      ${m?`<div class="step"><div class="label">Faça a conta antes de decidir</div>
        <div class="question">${esc(m.q)}</div><div class="eqbox">${esc(m.eq)}</div>
        <div class="opts">${m.opts.map((o,i)=>{let cls='';if(answered){if(Math.abs(o.v-m.correct)<1e-9)cls='right';else if(Math.abs(o.v-S.picked)<1e-9)cls='wrong'}
          return`<button class="opt ${cls}" data-v="${o.v}" ${answered?'disabled':''}><span class="k">${'ABCD'[i]}</span>${esc(o.t)}</button>`}).join('')}</div>
        ${answered?`<div class="feedback ${S.evOk?'ok':'no'}"><h3>${S.evOk?'Conta certa: decisão bem informada (+2 em '+attrName(S.bonusAttr||speedKey())+')':'Errou a conta, mas agora você sabe'}</h3><p>${esc(m.exp)}</p></div>`:''}
      </div>`:''}
      ${S.phase==='choose'?`<div class="step"><div class="label">Sua decisão</div><div class="choices">${ev.choices.map(c=>`<button class="choice" data-id="${c.id}" ${c.off?'disabled':''}><div class="hd">${c.club?crest(c.club,32):''}<strong>${esc(c.label)}</strong></div><span>${esc(c.off?'Dinheiro insuficiente · '+c.desc:c.desc)}</span></button>`).join('')}</div></div>`:''}`;
  } else if(S.phase==='match'){
    const M=S.match,cur=M.lances[M.i];
    const score=`<div class="scoreboard"><div class="team">${crest(S.club,44)}<span>${esc(S.club.n)}</span></div><div class="score num">${M.gf} × ${M.ga}</div><div class="team">${crest(M.rival,44)}<span>${esc(M.rival.n)}</span></div></div>`;
    const log=M.lances.slice(0,M.i).map((l,j)=>`<div class="lance ${l.ok?'ok':'no'}"><b>${j+1}º lance:</b> ${esc(l.res)}</div>`).join('');
    let inner='';
    if(!M.done&&cur){const ans=cur.picked!=null,q=cur.q;
      inner=`<div class="step"><div class="label">Lance ${M.i+1} de ${M.lances.length} · ${TOPICS[q.topic]}</div><p class="story" style="font-weight:700;margin-top:6px">${esc(cur.t)}</p><div class="question">${esc(q.q)}</div><div class="eqbox">${esc(q.eq)}</div>
       <div class="opts">${q.opts.map((o,i)=>{let cls='';if(ans){if(Math.abs(o.v-q.correct)<1e-9)cls='right';else if(Math.abs(o.v-cur.picked)<1e-9)cls='wrong'}return`<button class="opt mopt ${cls}" data-v="${o.v}" ${ans?'disabled':''}><span class="k">${'ABCD'[i]}</span>${esc(o.t)}</button>`}).join('')}</div>
       ${ans?`<div class="feedback ${cur.ok?'ok':'no'}"><h3>${esc(cur.res)}</h3><p>${esc(q.exp)}</p></div><div class="actions"><button class="btn" id="mnext">${M.i+1<M.lances.length?'Próximo lance':'Apito final'}</button></div>`:''}</div>`}
    else{const w=M.gf>M.ga,d=M.gf===M.ga;
      inner=`<div class="step"><h3 style="font-size:34px;color:${w?'var(--gold)':d?'var(--fg)':'var(--red)'}">${w?'Vitória!':d?'Empate':'Derrota'}</h3>${M.late?`<p class="mut" style="margin-top:4px">Fora dos seus lances, o adversário ainda marcou ${M.late===1?'um gol':'dois gols'}.</p>`:''}<p style="margin-top:6px">${w?'A vitória aumenta as suas chances de título nesta temporada.':d?'O empate mantém tudo igual na briga pelo título.':'A derrota diminui as suas chances de título nesta temporada.'}</p><div class="actions"><button class="btn" id="mfin">Ver a temporada</button></div></div>`}
    body=`<div class="season-head"><div><div class="label">Jogo decisivo · ${esc(lgOf(S.club).n)}</div><h2>Hora da verdade</h2></div></div>${score}<p class="story" style="margin-top:12px">Este jogo vale muito na briga pelo título. Cada conta certa é um lance bem-feito, e cada erro dá chance ao adversário.</p>${log?`<div class="lances">${log}</div>`:''}${inner}`;
  } else if(S.phase==='result'){
    const r=S.result,won=r.seasons.flatMap(h=>h.won||[]),tit=won.filter(t=>!['ball','boot','glove','star'].includes(ttype(t)));
    body=`${won.length?`<div class="celebrate pop"><div class="icons">${won.map((t,i)=>trophyIcon(t,52).replace('<svg ',`<svg style="animation-delay:${(i*0.12).toFixed(2)}s" `)).join('')}</div><div><div class="label">Conquistas</div><h3>${tit.length>1?'Temporada histórica!':tit.length?'Campeão!':'Prêmio individual!'}</h3><p>${esc(won.join(' · '))}</p></div></div>`:''}
      ${r.match?`<div class="matchsum">${crest(r.match.own,26)}<span>Jogo decisivo: <b>${esc(r.match.own.n)} ${r.match.gf} × ${r.match.ga} ${esc(r.match.rival.n)}</b> · ${r.match.gf>r.match.ga?'vitória, chances de título maiores':r.match.gf===r.match.ga?'empate':'derrota, chances de título menores'}</span>${crest(r.match.rival,26)}</div>`:''}
      <div class="season-head"><div><div class="label">Decisão: ${esc(ev.title)}</div><h2>O que aconteceu</h2></div></div>
      <p class="outcome">${esc(r.text)}</p>
      <div class="seasons">${r.seasons.map(h=>`<div class="srow pop">
        <div class="yr">${h.year}<small>${esc(h.club)}${h.loan?' (emp.)':''}</small></div>
        <div><div class="label">Geral</div><div class="v">${h.before} → ${h.ovr}</div></div>
        <div><div class="label">Jogos</div><div class="v">${h.games}</div></div>
        <div><div class="label">${S.pos==='GOL'?'S/ sofrer gol':'Gols'}</div><div class="v">${S.pos==='GOL'?h.cs:h.goals}</div></div>
        ${compLines(h)}
        ${natBlock(h.nat)}
        ${(h.won||[]).length?`<div class="trophies">${h.won.map(t=>`<span class="trophy">🏆 ${esc(t)}</span>`).join('')}</div>`:''}
        ${h.inj?`<div class="inj">🩹 ${esc(h.inj.t)} · ${h.inj.out} jogos fora${Object.entries(h.inj.loss).map(([k,v])=>` · −${-v} ${attrName(k)}`).join('')}</div>`:''}
      </div>`).join('')}</div>
      ${deltas()}
      <div class="actions"><button class="btn" id="nx">Seguir carreira</button></div>`;
  }
  const decs=S.decisions,A=accStats(),cp=Math.round(callChance()*100),wc=nextWC(),chs=chanceList();
  app.innerHTML=`
  <section class="game">
    <aside class="panel card">
      <div class="teamband" style="--t1:${cl.c};--t2:${cl.c2}">${crest(cl,54)}${shirt(cl,S.num,140)}</div>
      <div class="pname"><h2>${esc(S.nome)}</h2><div class="sub">${POS[S.pos]} · ${S.age} anos · ${esc(myNat())}</div></div>
      <div class="ovr"><span class="big num">${S.ovr}</span><div style="flex:1"><div class="label">Geral</div><div class="bar"><i style="width:${S.ovr}%"></i></div></div></div>
      <div class="club">${crest(cl,34)}<div><strong>${esc(S.club.n)}</strong><div class="label">${esc(lgTxt(S.club))}${S.loanHome?' · emprestado':''}</div></div></div>
      <div class="cardsec"><div class="row" style="justify-content:space-between;align-items:baseline"><span class="label">Contas certas</span><span><span class="accbig" style="color:${accColor(A.acc)}">${A.acc==null?'—':A.acc+'%'}</span> <span class="mut num" style="font-size:13px">${A.okN}/${A.n}</span></span></div><div class="bar"><i style="width:${A.acc||0}%"></i></div></div>
      ${shelf()}
      <div class="cardsec"><div class="label">Chance de título em ${S.year}</div>${chs.map(x=>`<div class="chrow"><span>${esc(x.n)}</span><b>${x.p}%</b><div class="bar"><i class="gold" style="width:${x.p}%"></i></div></div>`).join('')}</div>
      <div class="cardsec"><div class="label">Seleção (${esc(myNat())})</div>
        <div class="chrow"><span>Chance de convocação</span><b>${cp}%</b><div class="bar"><i class="sky" style="width:${cp}%"></i></div></div>
        <div class="money"><span class="mut">Próxima Copa do Mundo</span><strong>${wc?wc+(wc===S.year?' (este ano)':` (em ${wc-S.year} ano${wc-S.year>1?'s':''})`):'—'}</strong></div>
        <div class="money"><span class="mut">Jogos pela seleção</span><strong>${S.caps}</strong></div></div>
      <div class="cardsec"><div class="label">Atributos</div><div class="attrs">${attrList().map(([k,n])=>`<div class="at ${WEI[S.pos][k]>=.25?'key':''}"><span>${n}</span><b>${S.attr[k]}</b><div class="bar"><i style="width:${S.attr[k]}%"></i></div></div>`).join('')}</div></div>
      <div class="totals">
        <div><strong>${S.games}</strong><span>Jogos</span></div>
        <div><strong>${S.pos==='GOL'?S.cs:S.goals}</strong><span>${lbl}</span></div>
        <div><strong>${S.titles.length}</strong><span>Títulos</span></div>
      </div>
      <div class="money"><span class="label">Salário</span><strong>${brl(S.salary)}/mês</strong></div>
      <div class="money"><span class="label">Patrimônio</span><strong>${brl(S.money)}</strong></div>
      <div class="money"><span class="label">Fama</span><strong>${S.pop}/100</strong></div>
      <details><summary>Código para continuar em outro computador</summary>
        <div class="codebox" style="margin-top:10px"><textarea id="code" readonly>${encode(S)}</textarea>
        <div class="row"><button class="btn small ghost" id="cpy">Copiar código</button><span class="toast" id="cpm"></span></div>
        <p class="mut" style="font-size:13px">Neste computador a carreira já fica salva sozinha.</p></div></details>
    </aside>
    <div style="min-width:0">
      <div class="panel pop">${body}</div>
      <div class="panel timeline"><div class="label">Sala de troféus</div>${gallery()}</div>
      ${S.history.length?`<div class="panel timeline"><div class="label" style="margin-bottom:8px">Trajetória</div><div class="scroll"><table class="tl">
        <thead><tr><th>Ano</th><th>Idade</th><th>Clube</th><th style="text-align:right">Geral</th><th style="text-align:right">Jogos</th><th style="text-align:right">${lbl}</th><th>Liga</th><th>Lesão</th><th>Conquistas</th></tr></thead>
        <tbody>${S.history.slice().reverse().map(h=>{const lgc=(h.comps||[]).find(x=>x.k==='liga');return`<tr><td class="num">${h.year}</td><td class="num">${h.age}</td><td><div class="cl">${crest(h.cl||{n:h.club,s:h.cs_||'',c:h.cc||'#555'},20)}${esc(h.club)}${h.loan?' (emp.)':''}</div></td><td class="n">${h.ovr}</td><td class="n">${h.games}</td><td class="n">${S.pos==='GOL'?h.cs:h.goals}</td><td>${lgc?esc(lgc.res):'—'}</td><td>${h.inj?esc(h.inj.t):'—'}</td><td>${esc([...(h.won||[]),...(h.sel||[])].join(', ')||'—')}</td></tr>`}).join('')}</tbody></table></div></div>`:''}
      ${decs.length?`<div class="panel timeline"><div class="label" style="margin-bottom:8px">Decisões</div><div class="scroll"><table class="tl">
        <thead><tr><th>Ano</th><th>Situação</th><th>Escolha</th><th>Conta</th></tr></thead>
        <tbody>${decs.slice().reverse().map(d=>`<tr><td class="num">${d.y}</td><td>${esc(d.title)}</td><td>${esc(d.choice)}</td><td>${d.ok==null?'—':`<span class="mark ${d.ok?'ok':'no'}">${d.ok?'✓':'✗'} ${TOPICS[d.topic]}</span>`}</td></tr>`).join('')}</tbody></table></div></div>`:''}
    </div>
  </section>`;
  document.querySelectorAll('.opt:not(.mopt):not(:disabled)').forEach(b=>b.onclick=()=>answer(+b.dataset.v));
  document.querySelectorAll('.mopt:not(:disabled)').forEach(b=>b.onclick=()=>matchAnswer(+b.dataset.v));
  const mn=document.getElementById('mnext');if(mn)mn.onclick=matchNext;const mf=document.getElementById('mfin');if(mf)mf.onclick=finishStep;
  document.querySelectorAll('.choice:not(:disabled)').forEach(b=>b.onclick=()=>choose(b.dataset.id));
  const nx=document.getElementById('nx');if(nx)nx.onclick=startStep;
  document.getElementById('cpy').onclick=()=>copyFrom('code','cpm');
}
function copyFrom(id,msgId){const el=document.getElementById(id),m=document.getElementById(msgId),txt=el.value!==undefined?el.value:el.textContent;
  navigator.clipboard.writeText(txt).then(()=>m.textContent='Copiado').catch(()=>{if(el.select){el.select()}else{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}m.textContent='Selecionado: use Ctrl+C'})}

function finale(){
  const f=finalStats(),lbl=S.pos==="GOL"?"Jogos s/ gol":"Gols";
  const count=arr=>Object.entries(arr.reduce((m,x)=>(m[x.t]=(m[x.t]||0)+1,m),{})).map(([t,n])=>`${n}× ${t}`);
  const byTopic={};[...S.decisions.filter(d=>d.ok!=null),...(S.drills||[])].forEach(d=>{byTopic[d.topic]=byTopic[d.topic]||{ok:0,n:0};byTopic[d.topic].n++;if(d.ok)byTopic[d.topic].ok++});
  const clubs=[];S.clubs.forEach(c=>{if(!clubs.length||clubs[clubs.length-1].n!==c.n)clubs.push(c)});
  const tours=S.history.filter(h=>h.nat).map(h=>h.nat);
  const summary=`Craque dos Números\n${S.nome} #${S.num} · ${POS[S.pos]} · ${myNat()}\nNível: ${f.lvl} · geral máximo ${S.peak}\nClubes: ${clubs.map(c=>c.n+(c.loan?' (emp.)':'')).join(' → ')}\n${S.games} jogos · ${S.pos==='GOL'?S.cs+' jogos sem sofrer gol':S.goals+' gols'} · ${S.titles.length} títulos\nTítulos: ${count(S.titles).join(', ')||'nenhum'}\nPrêmios: ${count(S.awards).join(', ')||'nenhum'}\nSeleção: ${S.caps} jogos, ${S.wcs} Copa(s) do Mundo\nLesões: ${S.injuries||0}\nPatrimônio: ${brl(S.money)}\nAcertos em matemática: ${f.acc}% (${f.okN}/${f.n})`;
  app.innerHTML=`
  <section class="final pop">
    <div class="panel legend">
      <div class="row" style="gap:16px">${shirt(S.club,S.num,110)}
        <div><div class="label">${esc(S.retireText||'Fim de carreira')}</div><h1>${esc(S.nome)}</h1><h2 class="lvl" style="font-size:34px">${f.lvl}</h2></div></div>
      <div class="bigstats">
        <div><strong class="num">${S.games}</strong><span>Jogos</span></div>
        <div><strong class="num">${S.pos==='GOL'?S.cs:S.goals}</strong><span>${lbl}</span></div>
        <div><strong class="num">${S.titles.length}</strong><span>Títulos</span></div>
        <div><strong class="num">${S.peak}</strong><span>Geral máximo</span></div>
        <div><strong class="num">${S.caps}</strong><span>Jogos pela seleção</span></div>
        <div><strong class="num">${f.wc}</strong><span>Copas do Mundo ganhas</span></div>
      </div>
      <div style="margin-top:18px"><div class="label">Clubes</div>
        <div class="stack" style="gap:10px;margin-top:10px">${clubs.map(c=>`<div class="club">${crest(c,40)}<div><strong>${esc(c.n)}</strong>${c.loan?' <span class="pill">empréstimo</span>':''}<div class="label">desde ${c.from}</div></div></div>`).join('')}</div></div>
      ${S.legacy.length?`<div style="margin-top:16px"><div class="label">Legado</div><ul class="topics">${S.legacy.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`:''}
    </div>
    <div class="panel">
      <div class="label">Aproveitamento nas contas</div>
      <div class="acchero" style="color:${accColor(f.acc)};margin-top:8px">${f.acc}%</div>
      <div class="mut" style="margin-top:4px">${f.okN} conta${f.okN===1?' certa':'s certas'} de ${f.n}</div>
      <ul class="topics" style="margin-top:14px">${Object.entries(byTopic).map(([t,v])=>`<li><span>${TOPICS[t]}</span><span class="num">${v.ok}/${v.n} · ${Math.round(100*v.ok/v.n)}%</span></li>`).join('')}</ul>
      <div class="actions" style="justify-content:flex-start">
        <button class="btn" id="again">Nova carreira</button>
        <button class="btn ghost" id="copy">Copiar resumo</button>
        <span class="toast" id="tst"></span>
      </div>
      <pre class="sum" id="sum">${esc(summary)}</pre>
    </div>
  </section>
  <div class="panel timeline"><div class="label">Sala de troféus</div>${gallery()}</div>
  ${tours.length?`<div class="panel timeline"><div class="label" style="margin-bottom:8px">Seleção (${esc(myNat())})</div><div class="scroll"><table class="tl">
    <thead><tr><th>Ano</th><th>Competição</th><th>Chance de convocação</th><th>Resultado</th><th style="text-align:right">Gols</th></tr></thead>
    <tbody>${tours.map(n=>`<tr><td class="num">${n.year}</td><td>${esc(n.name)}</td><td class="num">${n.callP}%</td><td>${esc(n.finish)}</td><td class="n">${n.called?n.goals:'—'}</td></tr>`).join('')}</tbody></table></div></div>`:''}
  <div class="panel timeline"><div class="label" style="margin-bottom:8px">Decisões da carreira</div><div class="scroll"><table class="tl">
    <thead><tr><th>Ano</th><th>Situação</th><th>Escolha</th><th>Conta</th></tr></thead>
    <tbody>${S.decisions.map(d=>`<tr><td class="num">${d.y}</td><td>${esc(d.title)}</td><td>${esc(d.choice)}</td><td>${d.ok==null?'—':`<span class="mark ${d.ok?'ok':'no'}">${d.ok?'✓':'✗'} ${TOPICS[d.topic]}</span>`}</td></tr>`).join('')}</tbody></table></div></div>`;
  document.getElementById('again').onclick=()=>{clearSave();S=null;intro()};
  document.getElementById('copy').onclick=()=>copyFrom('sum','tst');
}

document.getElementById('home').onclick=()=>{intro()};
intro();
</script>

</body>
</html>
